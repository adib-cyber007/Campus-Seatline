      try {
        const savedTheme = localStorage.getItem('seatline_theme_v1')

          document.documentElement.dataset.theme = 'dark'
          document.documentElement.style.colorScheme = 'dark'
          document.querySelector('meta[name="theme-color"]').content = '#0F182B'
        }
      } catch {}
    </script>
